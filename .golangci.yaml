version: "2"

run:
  allow-parallel-runners: true
linters:
  default: none
  enable:
    - bodyclose
    - copyloopvar
    - depguard
    - errcheck
    - errorlint
    - forbidigo
    - govet
    - ineffassign
    - intrange
    - perfsprint
    - staticcheck
    - unused
    - mirror
    - durationcheck
    - errorlint
    - govet
    - unconvert
    - usetesting
    - zerologlint
    - testifylint
    - modernize
    - unconvert
    - unused
    - zerologlint
    - exptostd
  settings:
    depguard:
      rules:
        main:
          deny:
            - pkg: encoding/json
              desc: use github.com/segmentio/encoding/json
            - pkg: golang.org/x/exp
              desc: exp is not allowed
            - pkg: github.com/portainer/libcrypto
              desc: use github.com/portainer/portainer/pkg/libcrypto
            - pkg: github.com/portainer/libhttp
              desc: use github.com/portainer/portainer/pkg/libhttp
            - pkg: golang.org/x/crypto
              desc: golang.org/x/crypto is not allowed because of FIPS mode
            - pkg: software.sslmate.com/src/go-pkcs12
              desc: pkcs12 uses non-FIPS primitives (DES/SHA-1/PBKDF2); not allowed because of FIPS mode
            - pkg: github.com/ProtonMail/go-crypto/openpgp
              desc: github.com/ProtonMail/go-crypto/openpgp is not allowed because of FIPS mode
            - pkg: helm.sh/helm/v3/pkg/provenance
              desc: chart provenance verification uses openpgp; not allowed because of FIPS mode
            - pkg: helm.sh/helm/v4/pkg/provenance
              desc: chart provenance verification uses openpgp; not allowed because of FIPS mode
            - pkg: github.com/prometheus/exporter-toolkit
              desc: exporter-toolkit basic auth uses bcrypt; not allowed because of FIPS mode
            - pkg: github.com/cosi-project/runtime
              desc: github.com/cosi-project/runtime is not allowed because of FIPS mode
            - pkg: gopkg.in/yaml.v3
              desc: use go.yaml.in/yaml/v3 instead
    forbidigo:
      forbid:
        - pattern: ^tls\.Config$
          msg: Use crypto.CreateTLSConfiguration() instead
        - pattern: ^tls\.Config\.(InsecureSkipVerify|MinVersion|MaxVersion|CipherSuites|CurvePreferences)$
          msg: Do not set this field directly, use crypto.CreateTLSConfiguration() instead
        - pattern: ^object\.(Commit|Tag)\.Verify$
          msg: "Not allowed because of FIPS mode"
        - pattern: ^action\.(ChartPathOptions|Dependency)\.Verify$
          msg: "Chart provenance verification uses openpgp. Not allowed because of FIPS mode"
        - pattern: ^downloader\.(Manager|ChartDownloader)\.Verify$
          msg: "Chart provenance verification uses openpgp. Not allowed because of FIPS mode"
        - pattern: ^downloader\.(VerifyChart|VerifyAlways|VerifyIfPossible|VerifyLater)$
          msg: "Chart provenance verification uses openpgp. Not allowed because of FIPS mode"
        - pattern: ^ldap\.Conn\.(NTLMBind|NTLMBindWithHash|NTLMChallengeBind|NTLMUnauthenticatedBind|MD5Bind|DigestMD5Bind)$
          msg: "NTLM and DIGEST-MD5 binds use MD4/MD5/DES/RC4. Not allowed because of FIPS mode"
        - pattern: ^ldap\.Conn\.(GSSAPIBind|GSSAPIBindRequest|GSSAPIBindRequestWithAPOptions)$
          msg: "GSSAPI/Kerberos bind is not allowed because of FIPS mode"
        - pattern: ^(types\.SystemContext\.)?(DockerDaemonInsecureSkipTLSVerify|DockerInsecureSkipTLSVerify|OCIInsecureSkipTLSVerify)$
          msg: "Not allowed because of FIPS mode"
        - pattern: ^(chclient\.TLSConfig\.)?SkipVerify$
          msg: "Not allowed because of FIPS mode"
      analyze-types: true
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
